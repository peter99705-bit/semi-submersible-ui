<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四柱半潛式平台智慧控制儀表板</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent-blue: #00d2ff;
      --accent-green: #05d550;
      --accent-red: #ff4757;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: var(--accent-blue); margin-bottom: 20px; font-weight: 600; letter-spacing: 1px; }
    .btn-connect {
      background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
      color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold;
      border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.3s ease;
    }
    .btn-connect:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5); }
    
    .dashboard {
      width: 100%; max-width: 800px; margin-top: 25px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .card {
      background: var(--card-bg); padding: 20px; border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.3); text-align: center;
    }
    .card-full { grid-column: 1 / -1; }
    .val-display { font-size: 32px; font-weight: bold; color: var(--accent-blue); margin: 10px 0; }
    .status-box { font-size: 18px; color: var(--accent-green); padding: 5px; font-weight: bold; }

    .mode-switch { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
    .btn-mode {
      padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
      background: #2a3447; color: var(--text-sub); transition: 0.2s;
    }
    .btn-mode.active { background: var(--accent-blue); color: #000; box-shadow: 0 0 10px rgba(0, 210, 255, 0.4); }

    .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
    .column-box { background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; }
    .column-box b { color: var(--accent-blue); display: block; margin-bottom: 8px; text-align: center; }
    .btn-group { display: flex; gap: 8px; margin-top: 8px; }
    .btn-action {
      flex: 1; padding: 8px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; transition: 0.2s;
    }
    .btn-on { background-color: #10b981; }
    .btn-on:hover { background-color: #059669; }
    .btn-off { background-color: #ef4444; }
    .btn-off:hover { background-color: #dc2626; }
    .btn-danger {
      background-color: var(--accent-red); grid-column: 1 / -1; padding: 12px; font-size: 16px;
      border-radius: 8px; margin-top: 10px; cursor: pointer; border: none; color: white; font-weight: bold;
    }
    .btn-danger:hover { background-color: #dc2626; }
  </style>
</head>
<body>

  <h1>🌊 半潛式平台智慧控制儀表板</h1>
  <button class="btn-connect" onclick="connectBLE()">📡 連接 ESP32 控制板</button>

  <div class="dashboard">
    <div class="card">
      <div>俯仰角 (Pitch)</div>
      <div class="val-display" id="pitchVal">0.0°</div>
    </div>
    <div class="card">
      <div>橫滾角 (Roll)</div>
      <div class="val-display" id="rollVal">0.0°</div>
    </div>

    <div class="card card-full">
      <div>系統控制狀態</div>
      <div class="status-box" id="statusVal">等待連線...</div>
      <div class="mode-switch">
        <button class="btn-mode active" id="btnAuto" onclick="setMode('auto')">🤖 自動平衡模式</button>
        <button class="btn-mode" id="btnManual" onclick="setMode('manual')">🎮 手動控制模式</button>
      </div>
    </div>

    <div class="card card-full" id="manualPanel">
      <h3>🛠️ 獨立柱體手動控制 (ON / OFF)</h3>
      <div class="controls-grid">
        <!-- 柱 1 -->
        <div class="column-box">
          <b>柱 1 控制</b>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('p1_on')">充氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('p1_off')">充氣 關</button>
          </div>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('v1_on')">放氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('v1_off')">放氣 關</button>
          </div>
        </div>
        <!-- 柱 2 -->
        <div class="column-box">
          <b>柱 2 控制</b>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('p2_on')">充氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('p2_off')">充氣 關</button>
          </div>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('v2_on')">放氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('v2_off')">放氣 關</button>
          </div>
        </div>
        <!-- 柱 3 -->
        <div class="column-box">
          <b>柱 3 控制</b>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('p3_on')">充氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('p3_off')">充氣 關</button>
          </div>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('v3_on')">放氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('v3_off')">放氣 關</button>
          </div>
        </div>
        <!-- 柱 4 -->
        <div class="column-box">
          <b>柱 4 控制</b>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('p4_on')">充氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('p4_off')">充氣 關</button>
          </div>
          <div class="btn-group">
            <button class="btn-action btn-on" onclick="sendCmd('v4_on')">放氣 開</button>
            <button class="btn-action btn-off" onclick="sendCmd('v4_off')">放氣 關</button>
          </div>
        </div>

        <button class="btn-danger" onclick="sendCmd('all_off')">🛑 緊急安全全關 (All Off)</button>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a9";
    let bleCharacteristic;

    async function connectBLE() {
      if (!navigator.bluetooth) {
        alert("您的瀏覽器不支援網頁藍牙！請使用 Chrome 或 Edge。");
        return;
      }

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'SemiSub-Controller' }],
          optionalServices: [SERVICE_UUID] // 解決 NotSupportedError 關鍵
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await bleCharacteristic.startNotifications();
        bleCharacteristic.addEventListener('characteristicvaluechanged', handleData);
        document.getElementById('statusVal').innerText = "✅ 已成功連線 ESP32！";
      } catch (error) {
        console.error("連線失敗:", error);
        alert("連線失敗或已取消：" + error.message);
      }
    }

    function handleData(event) {
      const decoder = new TextDecoder('utf-8');
      const jsonStr = decoder.decode(event.target.value);
      try {
        const data = JSON.parse(jsonStr);
        document.getElementById('pitchVal').innerText = data.pitch + "°";
        document.getElementById('rollVal').innerText = data.roll + "°";
        document.getElementById('statusVal').innerText = data.status;
      } catch (e) {}
    }

    async function sendCmd(cmd) {
      if (bleCharacteristic) {
        let encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(cmd));
      } else {
        alert("尚未連接藍牙！請先點擊上方按鈕連線。");
      }
    }

    function setMode(mode) {
      if(mode === 'auto') {
        document.getElementById('btnAuto').classList.add('active');
        document.getElementById('btnManual').classList.remove('active');
        sendCmd('auto');
      } else {
        document.getElementById('btnManual').classList.add('active');
        document.getElementById('btnAuto').classList.remove('active');
        sendCmd('manual');
      }
    }
  </script>
</body>
</html>
