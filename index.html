<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AIOT 半潛平台控制</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 30px; background: #f4f6f9; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { padding: 12px 20px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; }
        .btn-con { background: #007bff; color: white; }
        .btn-on { background: #28a745; color: white; }
        .btn-off { background: #6c757d; color: white; }
        .btn-stop { background: #dc3545; color: white; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌊 半潛平台控制面板</h2>
        <button class="btn-con" onclick="connectBLE()">連接 ESP32 藍牙</button>
        <p>狀態: <span id="status" style="color:red; font-weight:bold;">未連線</span></p>

        <hr>
        <h3>立柱 1 控制</h3>
        <button class="btn-on" onclick="send('1,pump,1')">打氣 ON</button>
        <button class="btn-off" onclick="send('1,pump,0')">打氣 OFF</button><br>
        <button class="btn-on" onclick="send('1,valve,1')">排氣 ON</button>
        <button class="btn-off" onclick="send('1,valve,0')">排氣 OFF</button>

        <button class="btn-stop" onclick="send('emergency_stop')">⚠️ 緊急全部關閉</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a6";
        let characteristic;

        async function connectBLE() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);

                document.getElementById('status').innerText = "已連線";
                document.getElementById('status').style.color = "green";
                alert("藍牙連線成功！");
            } catch (error) {
                alert("連線失敗: " + error);
            }
        }

        async function send(cmd) {
            if (!characteristic) {
                alert("請先連線藍牙！");
                return;
            }
            const encoder = new TextEncoder();
            await characteristic.writeValue(encoder.encode(cmd));
        }
    </script>
</body>
</html>
